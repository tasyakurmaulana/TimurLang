name: timurlang
description: "Sistem Informasi Perizinan & Keselamatan Pendakian Terpadu"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  sensors_plus: ^6.1.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.4
  permission_handler: ^11.4.0
  flutter_compass: ^0.8.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
